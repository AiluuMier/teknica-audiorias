{% extends "base.html" %}
{% block right %}
  <div class="d-flex align-items-center gap-3">

    <!-- Botón de instalación SIEMPRE visible -->
    <button id="btnInstalar" class="btn btn-sm btn-success">
      📥 Instalar App
    </button>

    <!-- Botón visible solo para administradores -->
    {% if session.get('rol') == 'admin' %}
      <a href="{{ url_for('admin_panel') }}" class="btn btn-sm btn-outline-dark">Panel Admin</a>
    {% endif %}

    <!-- Botón Mis Auditorías (Visible solo para supervisores) -->
    {% if session.get('rol') == 'supervisor' %}
      <a href="{{ url_for('mis_auditorias') }}" class="btn btn-sm btn-outline-primary">Mis Auditorías</a>
    {% endif %}

    <!-- Botón de Cerrar sesión -->
    <form action="{{ url_for('logout') }}" method="post" class="m-0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-sm btn-outline-danger">Cerrar sesión</button>
    </form>
 </div>
    {% include '_avatar.html' %}

<!-- Script para que el botón active la instalación al hacerle clic -->
<script>
  let deferredPrompt;

  window.addEventListener('beforeinstallprompt', (e) => {
      // Guardamos el evento para cuando el usuario haga clic
      e.preventDefault();
      deferredPrompt = e;
  });

  document.getElementById('btnInstalar').addEventListener('click', () => {
      if (deferredPrompt) {
          // Si el navegador tiene lista la instalación, la lanza
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
              deferredPrompt = null;
          });
      } else {
          // Si ya está instalada o el navegador no lo permite por estar en otra vista
          alert("La aplicación ya está instalada en este dispositivo o tu navegador la abrió en modo aplicación.");
      }
  });
</script>
{% endblock %}
