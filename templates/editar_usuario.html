{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4">
        <h2 class="h4 fw-bold text-navy mb-3">Editar Usuario</h2>
        
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico:</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ usuario.email }}" required>
          </div>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre y Apellido:</label>
            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ usuario.nombre }}">
          </div>

          <div class="mb-3">
            <label for="rol" class="form-label">Rol:</label>
            <select id="rol" name="rol" class="form-select">
              <option value="supervisor" {% if usuario.rol == 'supervisor' %}selected{% endif %}>supervisor</option>
              <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>admin</option>
            </select>
          </div>

          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="{{ url_for('admin_panel') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
